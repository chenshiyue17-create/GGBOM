protocol_version: '1.0'
architecture_pattern: Data-Driven Policy-Based Pure Blueprint
core_principles:
- No single monolithic God Component
- Data / Policies / Presentation / UI decoupled
- Semantic Event Broadcasting over tight coupling
- Orthographic 2D Retro Action rendering with locked Camera (941.0) & Sampling (TA_Clamp,
  TMGS_NoMipmaps)
- Zero Hardcoded Weapon/Enemy branches in core mechanics
